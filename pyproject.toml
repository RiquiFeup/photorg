[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "photorg"
version = "0.1.0"
description = "Auto-organise vacation photos by date and AI-detected location"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8.0",
    "Pillow>=12.0.0",
]

[project.scripts]
photorg = "photorg.main:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.0", "hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["photorg"]
